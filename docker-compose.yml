services:
  tickethelper:
    build: .
    image: tickethelper-linux:0.1
    container_name: tickethelper
    restart: unless-stopped
    ports:
      # 只绑内网；要公网自己接反代
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      # 留空 = 首次启动随机生成口令并打印到日志（docker compose logs -f tickethelper | grep 口令）
      # 想自己定就直接填，别用弱口令
      ADMIN_PASSWORD: ""
      JAVA_OPTS: "-Xms128m -Xmx384m"
    volumes:
      # 会话、配置、日志、数据库都在这里，务必备份
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
