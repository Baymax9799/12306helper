name: Docker

# 两种触发方式：
#   - push 到 main：构建并推 `latest` 和 `main`
#   - 推 v* tag：构建并推 `latest` 和该 tag（发版用）
# 也可以到 Actions 页面手动 Run workflow。
#
# 需要先配两样东西（仓库 Settings → Secrets and variables → Actions）：
#   Variables: DOCKERHUB_USERNAME  （用户名不算机密）
#   Secrets:   DOCKERHUB_TOKEN     （Access Token，不要用登录密码）
on:
  push:
    branches: [main]
    tags: ['v*']
    # 纯文档/CI 改动不重建镜像，省 Actions 额度
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/**'
      - 'docker-compose*.yml'
      - '.env.example'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 一次推两个标签：latest 和本次的版本/分支名
          tags: |
            ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}/12306helper:latest
            ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}/12306helper:${{ github.ref_name }}
