name: Docker

# 打 tag（如 v0.1.0）时构建并推送到 Docker Hub。
# 需要先在仓库 Settings → Secrets 里配 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tickethelper-linux:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tickethelper-linux:${{ github.ref_name }}
