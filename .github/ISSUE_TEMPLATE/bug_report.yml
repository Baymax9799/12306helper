name: 问题反馈
description: 部署或使用中遇到的问题（尤其是实盘验证的结论）
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        贴日志前请先脱敏：删掉 `RAIL_DEVICEID`、`_passport_session` 这类 Cookie，以及手机号、身份证号。

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 从 Docker Hub 拉取
        - 本地构建（docker compose up --build）
        - 源码直接运行（java -jar）
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 镜像标签 / 版本
      placeholder: v0.1.0 或 latest
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      placeholder: 群晖 DS923+ / 飞牛 fnOS / 自建 E3-1225v6 / Debian 12 等

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      placeholder: 比如「开了自动下单，提交时一直返回排队人数大于余票」
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 扫码登录
        2. 建任务：广州南 → 长沙南，2026-12-01，二等座
        3. 开自动下单，10:00 开始
        4. 10:00:03 报错

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: docker compose logs 12306helper --tail 200
      render: shell

  - type: checkboxes
    id: redacted
    attributes:
      label: 确认
      options:
        - label: 我已删除日志里的 Cookie、手机号、身份证号
          required: true
        - label: 这是一次真实账号的验证（不是猜测性问题）
          required: false
